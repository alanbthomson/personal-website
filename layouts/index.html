{{- define "main" -}} {{ $x := "what" }} {{- $lang := .Site.Language.Lang -}}
{{- $copy := index .Site.Data.home $lang -}}

<div id="homepage">
    <div class="construction-notice">
        <h1>{{ $copy.construction.title }}</h1>
        <div class="construction-description">
            <p>{{ $copy.construction.description }}</p>
            <a href="{{ $copy.links.projects.link }}"
                >{{ $copy.links.projects.text }}</a
            >
        </div>
    </div>
    {{- partial "social_icons.html" -}}
</div>
<style>
    .construction-description {
        display: flex;
        align-items: center;
        gap: 0 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
    }

    #homepage {
        min-height: 75vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
</style>

{{- end -}}
